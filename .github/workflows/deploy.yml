name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanitize names
        id: names
        run: |
          RAW="${{ secrets.QZ }}"
          SAFE=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          echo "safe_qz=$SAFE" >> $GITHUB_OUTPUT
          echo "worker_name=$SAFE-worker" >> $GITHUB_OUTPUT
          echo "db_name=$SAFE-db" >> $GITHUB_OUTPUT
          echo "domain=$SAFE.${{ secrets.YUM }}" >> $GITHUB_OUTPUT
          echo "raw_qz=$RAW" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Get CF Account ID
        id: account
        run: |
          ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer ${{ secrets.API }}" \
            | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8'));if(d&&d.result&&d.result[0])console.log(d.result[0].id);else{console.error('No Cloudflare account found');process.exit(1)}")
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Enable workers.dev subdomain
        id: subdomain
        run: |
          SUBDOMAIN="${{ steps.names.outputs.safe_qz }}"
          RESULT=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.account_id }}/workers/subdomain" \
            -H "Authorization: Bearer ${{ secrets.API }}" \
            -H "Content-Type: application/json")
          EXISTING=$(echo "$RESULT" | node -pe "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).result?.subdomain||''")
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" != "$SUBDOMAIN" ]; then
              echo "workers.dev subdomain exists as '$EXISTING', updating to '$SUBDOMAIN'"
              RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.account_id }}/workers/subdomain" \
                -H "Authorization: Bearer ${{ secrets.API }}" \
                -H "Content-Type: application/json" \
                -d "{\"subdomain\":\"$SUBDOMAIN\"}")
            else
              echo "workers.dev subdomain '$SUBDOMAIN' is already enabled"
            fi
          else
            echo "Enabling workers.dev subdomain: $SUBDOMAIN"
            RESULT=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.account_id }}/workers/subdomain" \
              -H "Authorization: Bearer ${{ secrets.API }}" \
              -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"$SUBDOMAIN\"}")
          fi
          echo "$RESULT" | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8'));console.log(d.success?'OK: '+(d.result?d.result.subdomain:'unknown'):'FAIL: '+(d.errors?JSON.stringify(d.errors):'unknown'))"

      - name: Create D1 Database
        id: d1
        run: |
          npx wrangler d1 create ${{ steps.names.outputs.db_name }} --location=apac 2>/dev/null || true
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8'));const db=d.find(x=>x.name==='${{ steps.names.outputs.db_name }}');if(db)console.log(db.uuid);else{console.error('D1 database not found');process.exit(1)}}catch(e){console.error('Failed to parse D1 list:',e.message);process.exit(1)}")
          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Update wrangler.toml
        run: |
          sed -i "s/{{DB_NAME}}/${{ steps.names.outputs.db_name }}/g" wrangler.toml
          sed -i "s/{{D1_DATABASE_ID}}/${{ steps.d1.outputs.database_id }}/g" wrangler.toml
          sed -i "s/name = \"okx-auto-trader\"/name = \"${{ steps.names.outputs.worker_name }}\"/g" wrangler.toml

      - name: Initialize D1 Schema
        run: |
          npx wrangler d1 execute ${{ steps.names.outputs.db_name }} --file=./schema.sql --remote
          sleep 5
          npx wrangler d1 execute ${{ steps.names.outputs.db_name }} --file=./seed.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Run D1 Migrations
        run: |
          npx wrangler d1 execute ${{ steps.names.outputs.db_name }} --file=./migrate.sql --remote || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Set Worker Secrets
        run: |
          echo "${{ secrets.OKX_API_KEY }}" | npx wrangler secret put OKX_API_KEY
          echo "${{ secrets.OKX_SECRET_KEY }}" | npx wrangler secret put OKX_SECRET_KEY
          echo "${{ secrets.OKX_PASSPHRASE }}" | npx wrangler secret put OKX_PASSPHRASE
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.API }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Bind Custom Domain Route
        id: route
        run: |
          CF_API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer ${{ secrets.API }}"
          DOMAIN="${{ steps.names.outputs.domain }}"
          WORKER="${{ steps.names.outputs.worker_name }}"

          echo "Looking up zone for ${{ secrets.YUM }}..."
          ZONES=$(curl -s "$CF_API/zones?name=${{ secrets.YUM }}" -H "$AUTH")
          ZONE_ID=$(echo "$ZONES" | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8'));if(d&&d.result&&d.result[0])console.log(d.result[0].id);else console.log('')")

          if [ -z "$ZONE_ID" ]; then
            echo "::warning::Zone not found for ${{ secrets.YUM }} - domain route cannot be created"
            echo "route_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Zone ID: $ZONE_ID"

          ROUTE_DATA="{\"pattern\":\"$DOMAIN/*\",\"script\":\"$WORKER\"}"
          EXISTING=$(curl -s "$CF_API/zones/$ZONE_ID/workers/routes" -H "$AUTH")
          ROUTE_ID=$(echo "$EXISTING" | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8'));if(d&&d.result){const r=d.result.find(x=>x&&x.pattern&&x.pattern.includes('${{ steps.names.outputs.safe_qz }}'));if(r)console.log(r.id);else console.log('')}else console.log('')")

          if [ -n "$ROUTE_ID" ]; then
            echo "Updating existing route $ROUTE_ID for $DOMAIN/*"
            curl -s -X PUT "$CF_API/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
              -H "$AUTH" -H "Content-Type: application/json" -d "$ROUTE_DATA"
          else
            echo "Creating new route for $DOMAIN/* -> $WORKER"
            RESULT=$(curl -s -X POST "$CF_API/zones/$ZONE_ID/workers/routes" \
              -H "$AUTH" -H "Content-Type: application/json" -d "$ROUTE_DATA")
            echo "$RESULT" | node -pe "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));d.success?'Route OK: '+d.result.id:'FAIL: '+(d.errors?JSON.stringify(d.errors):'unknown')"
          fi

          echo "route_ok=true" >> $GITHUB_OUTPUT

      - name: Verify Deployment
        run: |
          WORKER_URL="https://${{ steps.names.outputs.worker_name }}.${{ steps.names.outputs.safe_qz }}.workers.dev"
          CUSTOM_URL="https://${{ steps.names.outputs.domain }}"

          echo "::notice::Worker URL: $WORKER_URL"
          echo "::notice::Custom URL: $CUSTOM_URL"

          if curl -sf --max-time 10 "$WORKER_URL/api/status" 2>/dev/null; then
            echo "::notice::Worker URL OK: $WORKER_URL"
          else
            echo "::warning::Worker URL unreachable: $WORKER_URL (workers.dev may not be enabled)"
          fi

          if [ "${{ steps.route.outputs.route_ok }}" = "true" ]; then
            sleep 15
            if curl -sf --max-time 10 "$CUSTOM_URL/api/status" 2>/dev/null; then
              echo "::notice::Custom domain OK: $CUSTOM_URL"
            else
              echo "::warning::Custom domain unreachable: $CUSTOM_URL (DNS may need propagation)"
            fi
          fi
