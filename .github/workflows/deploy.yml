name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master]
  schedule:
    # 每 30 分钟自动触发一次工作流部署到 Cloudflare
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.API }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare Credentials
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::未检测到 Cloudflare API Token！请前往 GitHub 仓库的 Settings -> Secrets and variables -> Actions 添加 Secret：名称为 API 或 CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Sanitize names
        id: names
        run: |
          RAW="${{ secrets.QZ }}"
          if [ -z "$RAW" ]; then
            RAW="okx-auto-trader"
          fi
          SAFE=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE" ]; then
            SAFE="okx-auto-trader"
          fi
          echo "safe_qz=$SAFE" >> $GITHUB_OUTPUT
          echo "worker_name=$SAFE-worker" >> $GITHUB_OUTPUT
          echo "db_name=$SAFE-db" >> $GITHUB_OUTPUT
          if [ -n "${{ secrets.YUM }}" ]; then
            echo "domain=$SAFE.${{ secrets.YUM }}" >> $GITHUB_OUTPUT
          else
            echo "domain=" >> $GITHUB_OUTPUT
          fi
          echo "raw_qz=$RAW" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Get CF Account ID
        id: account
        run: |
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          if [ -z "$ACCOUNT_ID" ]; then
            ACCOUNT_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts" \
              -H "Authorization: Bearer $CF_TOKEN" \
              | node -e "const fs=require('fs');try{const d=JSON.parse(fs.readFileSync(0,'utf8'));if(d&&d.result&&d.result[0])console.log(d.result[0].id);else{console.error('No Cloudflare account found');process.exit(1)}}catch(e){console.error('Failed to parse CF account:',e.message);process.exit(1)}")
          fi
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

      - name: Enable workers.dev subdomain
        id: subdomain
        run: |
          SUBDOMAIN="${{ steps.names.outputs.safe_qz }}"
          RESULT=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.account_id }}/workers/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json")
          EXISTING=$(echo "$RESULT" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).result?.subdomain||''")
          FINAL_SUBDOMAIN="$SUBDOMAIN"
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" != "$SUBDOMAIN" ]; then
              echo "workers.dev subdomain exists as '$EXISTING', attempting to update to '$SUBDOMAIN'"
              UPDATE_RES=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.account_id }}/workers/subdomain" \
                -H "Authorization: Bearer $CF_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"subdomain\":\"$SUBDOMAIN\"}")
              OK=$(echo "$UPDATE_RES" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).success||false")
              if [ "$OK" = "true" ]; then
                FINAL_SUBDOMAIN="$SUBDOMAIN"
              else
                echo "Subdomain '$SUBDOMAIN' unavailable or already allocated. Using existing account subdomain: '$EXISTING'"
                FINAL_SUBDOMAIN="$EXISTING"
              fi
            else
              echo "workers.dev subdomain '$SUBDOMAIN' is already enabled"
              FINAL_SUBDOMAIN="$SUBDOMAIN"
            fi
          else
            echo "Enabling workers.dev subdomain: $SUBDOMAIN"
            CREATE_RES=$(curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/${{ steps.account.outputs.account_id }}/workers/subdomain" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"subdomain\":\"$SUBDOMAIN\"}")
            FINAL_SUBDOMAIN=$(echo "$CREATE_RES" | node -pe "JSON.parse(require('fs').readFileSync(0,'utf8')).result?.subdomain||'$SUBDOMAIN'")
          fi
          echo "final_subdomain=$FINAL_SUBDOMAIN" >> $GITHUB_OUTPUT

      - name: Create D1 Database
        id: d1
        run: |
          npx wrangler d1 create ${{ steps.names.outputs.db_name }} --location=apac 2>/dev/null || true
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | node -e "const fs=require('fs');try{const raw=fs.readFileSync(0,'utf8');const s=raw.indexOf('[');const e=raw.lastIndexOf(']');const d=(s!==-1&&e!==-1)?JSON.parse(raw.slice(s,e+1)):JSON.parse(raw);const db=Array.isArray(d)?d.find(x=>x&&(x.name==='${{ steps.names.outputs.db_name }}'||x.database_name==='${{ steps.names.outputs.db_name }}')):null;const id=db?(db.uuid||db.id||db.database_id):null;if(id)console.log(id);else{console.error('D1 database not found');process.exit(1)}}catch(e){console.error('Failed to parse D1 list:',e.message);process.exit(1)}")
          echo "database_id=$DB_ID" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Update wrangler.toml
        run: |
          sed -i "s/{{DB_NAME}}/${{ steps.names.outputs.db_name }}/g" wrangler.toml
          sed -i "s/{{D1_DATABASE_ID}}/${{ steps.d1.outputs.database_id }}/g" wrangler.toml
          sed -i "s/name = \"okx-auto-trader\"/name = \"${{ steps.names.outputs.worker_name }}\"/g" wrangler.toml

      - name: Initialize D1 Schema
        run: |
          npx wrangler d1 execute ${{ steps.names.outputs.db_name }} --file=./schema.sql --remote --yes
          sleep 5
          npx wrangler d1 execute ${{ steps.names.outputs.db_name }} --file=./seed.sql --remote --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Run D1 Migrations
        run: |
          npx wrangler d1 execute ${{ steps.names.outputs.db_name }} --file=./migrate.sql --remote --yes || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Set Worker Secrets
        run: |
          if [ -n "${{ secrets.OKX_API_KEY }}" ]; then
            echo "${{ secrets.OKX_API_KEY }}" | npx wrangler secret put OKX_API_KEY
          fi
          if [ -n "${{ secrets.OKX_SECRET_KEY }}" ]; then
            echo "${{ secrets.OKX_SECRET_KEY }}" | npx wrangler secret put OKX_SECRET_KEY
          fi
          if [ -n "${{ secrets.OKX_PASSPHRASE }}" ]; then
            echo "${{ secrets.OKX_PASSPHRASE }}" | npx wrangler secret put OKX_PASSPHRASE
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}

      - name: Bind Custom Domain Route
        id: route
        run: |
          if [ -z "${{ secrets.YUM }}" ] || [ -z "${{ steps.names.outputs.domain }}" ]; then
            echo "Custom domain (YUM) not configured, skipping custom domain route"
            echo "route_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          CF_API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CF_TOKEN"
          DOMAIN="${{ steps.names.outputs.domain }}"
          WORKER="${{ steps.names.outputs.worker_name }}"

          echo "Looking up zone for ${{ secrets.YUM }}..."
          ZONES=$(curl -s "$CF_API/zones?name=${{ secrets.YUM }}" -H "$AUTH")
          ZONE_ID=$(echo "$ZONES" | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8'));if(d&&d.result&&d.result[0])console.log(d.result[0].id);else console.log('')")

          if [ -z "$ZONE_ID" ]; then
            echo "::warning::Zone not found for ${{ secrets.YUM }} - domain route cannot be created"
            echo "route_ok=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Zone ID: $ZONE_ID"

          ROUTE_DATA="{\"pattern\":\"$DOMAIN/*\",\"script\":\"$WORKER\"}"
          EXISTING=$(curl -s "$CF_API/zones/$ZONE_ID/workers/routes" -H "$AUTH")
          ROUTE_ID=$(echo "$EXISTING" | node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('/dev/stdin','utf8'));if(d&&d.result){const r=d.result.find(x=>x&&x.pattern&&x.pattern.includes('${{ steps.names.outputs.safe_qz }}'));if(r)console.log(r.id);else console.log('')}else console.log('')")

          if [ -n "$ROUTE_ID" ]; then
            echo "Updating existing route $ROUTE_ID for $DOMAIN/*"
            curl -s -X PUT "$CF_API/zones/$ZONE_ID/workers/routes/$ROUTE_ID" \
              -H "$AUTH" -H "Content-Type: application/json" -d "$ROUTE_DATA"
          else
            echo "Creating new route for $DOMAIN/* -> $WORKER"
            RESULT=$(curl -s -X POST "$CF_API/zones/$ZONE_ID/workers/routes" \
              -H "$AUTH" -H "Content-Type: application/json" -d "$ROUTE_DATA")
            echo "$RESULT" | node -pe "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));d.success?'Route OK: '+d.result.id:'FAIL: '+(d.errors?JSON.stringify(d.errors):'unknown')"
          fi

          echo "route_ok=true" >> $GITHUB_OUTPUT

      - name: Verify Deployment
        run: |
          SUB="${{ steps.subdomain.outputs.final_subdomain }}"
          if [ -z "$SUB" ]; then
            SUB="${{ steps.names.outputs.safe_qz }}"
          fi
          WORKER_URL="https://${{ steps.names.outputs.worker_name }}.$SUB.workers.dev"
          CUSTOM_URL="https://${{ steps.names.outputs.domain }}"

          echo "::notice::Worker URL: $WORKER_URL"
          echo "::notice::Custom URL: $CUSTOM_URL"

          if curl -sf --max-time 10 "$WORKER_URL/api/status" 2>/dev/null; then
            echo "::notice::Worker URL OK: $WORKER_URL"
          else
            echo "::warning::Worker URL unreachable: $WORKER_URL (workers.dev may not be enabled)"
          fi

          if [ "${{ steps.route.outputs.route_ok }}" = "true" ]; then
            sleep 15
            if curl -sf --max-time 10 "$CUSTOM_URL/api/status" 2>/dev/null; then
              echo "::notice::Custom domain OK: $CUSTOM_URL"
            else
              echo "::warning::Custom domain unreachable: $CUSTOM_URL (DNS may need propagation)"
            fi
          fi
